# The interface strings: lib/l10n/app_en.arb is the template, app_zh.arb the
# Traditional Chinese. `flutter pub get` regenerates app_localizations*.dart
# next to them; the generated files are committed so analyze and an IDE work
# before any generation step.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
synthetic-package: false
nullable-getter: false
