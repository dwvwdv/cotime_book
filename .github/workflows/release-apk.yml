name: Build and Release

on:
  push:
    branches: [ master ]
    # 只動文件的 push（issue.md、CLAUDE.md、.claude/ 的 skill）不重新出版：tag 取自
    # pubspec 的版號，而文件 PR 不 bump（見 .claude/skills/version-update.md），
    # 觸發了只會把同一份 build 再掛到同一個 release 上。
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & AAB
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --timeout 2m

      - name: Check if keystore secrets exist
        id: check_secrets
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "✓ Keystore secrets found, will build signed release"
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "⚠ No keystore secrets, will build debug version"
          fi

      - name: Decode and setup keystore
        if: steps.check_secrets.outputs.has_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release-key.jks
          EOF
          echo "✓ Keystore configured successfully"

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: /v/')
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Detected version: ${VERSION}"

      - name: Build APK (arm64)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          DART_DEFINES=""
          if [ -n "$SUPABASE_URL" ]; then
            DART_DEFINES="--dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          fi

          if [ "${{ steps.check_secrets.outputs.has_keystore }}" == "true" ]; then
            echo "Building signed release APK (arm64)..."
            flutter build apk --release --target-platform android-arm64 $DART_DEFINES
          else
            echo "Building debug APK (arm64)..."
            flutter build apk --debug --target-platform android-arm64 $DART_DEFINES
          fi

      - name: Rename APK
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk \
               build/app/outputs/flutter-apk/cotime_book-${VERSION}.apk
          elif [ -f build/app/outputs/flutter-apk/app-debug.apk ]; then
            cp build/app/outputs/flutter-apk/app-debug.apk \
               build/app/outputs/flutter-apk/cotime_book-${VERSION}-debug.apk
          fi

      # 上傳 artifact 要排在 Telegram 之前：備援訊息要附上它的下載連結。
      - name: Upload APK artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/cotime_book-*.apk
          retention-days: 30
          if-no-files-found: ignore

      # 通知是 best effort：curl 一律加逾時，上傳 APK 失敗就改送 artifact 連結，
      # 連那個也失敗也不讓 job 變紅（後面還要建 release）。
      - name: Send APK to Telegram
        if: steps.check_secrets.outputs.has_keystore == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload_apk.outputs.artifact-id }}
        run: |
          if curl --ipv4 --connect-timeout 10 --max-time 30 --fail-with-body \
               -F document=@build/app/outputs/flutter-apk/app-release.apk \
               -F caption="🚀 Release ${{ steps.get_version.outputs.VERSION }}
          Commit: ${GITHUB_SHA::7}
          Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
               "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument?chat_id=${TELEGRAM_CHAT_ID}"; then
            echo "APK sent to Telegram"
          else
            echo "Telegram upload failed; sending GitHub artifact link"
            fallback_text=$(printf '%s\n' \
              '🚀 Release APK upload fallback' \
              'Telegram upload failed or timed out.' \
              "Download artifact: ${ARTIFACT_URL}")
            if curl --ipv4 --connect-timeout 10 --max-time 30 --fail-with-body -sS -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode text="${fallback_text}"; then
              echo "GitHub artifact link sent to Telegram"
            else
              echo "Telegram fallback notification failed; continuing without notification"
            fi
          fi
        continue-on-error: true

      - name: Build App Bundle (AAB)
        if: steps.check_secrets.outputs.has_keystore == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          DART_DEFINES=""
          if [ -n "$SUPABASE_URL" ]; then
            DART_DEFINES="--dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          fi
          echo "Building signed App Bundle..."
          flutter build appbundle --release $DART_DEFINES

      - name: Rename AAB
        if: steps.check_secrets.outputs.has_keystore == 'true'
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          cp build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/cotime_book-${VERSION}.aab

      - name: Upload AAB artifact
        if: steps.check_secrets.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: build/app/outputs/bundle/release/cotime_book-*.aab
          retention-days: 30

      - name: Create Release
        if: steps.check_secrets.outputs.has_keystore == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          files: |
            build/app/outputs/flutter-apk/cotime_book-*.apk
            build/app/outputs/bundle/release/cotime_book-*.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
