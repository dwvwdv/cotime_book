name: cotime_book
description: 頁間（CoTime Book）- 遠程同步看書工具
publish_to: 'none'
version: 1.0.25+29

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Backend
  supabase_flutter: ^2.8.0
  # The public library's folder (library_service). Already a dependency of
  # supabase_flutter; listed so the library can depend on it directly.
  http: ^1.2.0

  # Routing
  go_router: ^14.6.0

  # EPUB Reading
  flutter_epub_viewer: ^1.2.5

  # Direct book transfer (GH-60): a data channel between two devices, with
  # the Realtime broadcast as the fallback. Native libwebrtc, not the WebView.
  flutter_webrtc: ^1.6.2

  # File handling
  file_picker: ^8.1.0
  path_provider: ^2.1.0
  crypto: ^3.0.6
  # TXT import: GBK / Big5 decoding and building the EPUB. enough_convert
  # stays on 1.6: 1.7 needs Dart 3.11, newer than CI's Flutter 3.32.4.
  enough_convert: ">=1.6.0 <1.7.0"
  archive: ^4.0.0

  # Interstitial ads. Stays on 6.x: 7.0 needs Flutter 3.35, newer than CI's
  # Flutter 3.32.4.
  google_mobile_ads: ">=6.0.0 <7.0.0"
  # AdMob mediation: the Liftoff Monetize bidding adapter (Google's plugin,
  # with its Android adapter and Vungle SDK). No Dart calls needed; the
  # Mediation Group in AdMob decides who bids. 1.4.2 needs google_mobile_ads 7.
  gma_mediation_liftoffmonetize: ">=1.4.1 <1.4.2"

  # Google Play in-app update (app_update_service): checked on start and at
  # most every 4 hours on resume, installed only outside a room.
  in_app_update: ^4.2.3

  # UI
  gap: ^3.0.1

  # Utilities
  uuid: ^4.5.1
  json_annotation: ^4.9.0
  collection: ^1.19.1
  shared_preferences: ^2.5.3
  # More Apps opens Google Play. Already a dependency of supabase_flutter.
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.4
  json_serializable: ^6.9.4
  flutter_launcher_icons: ^0.14.3
  xml: ^6.5.0
  fake_async: ^1.3.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    # The shared page (issue #20): the font every reader's book is set in,
    # and the script that lays the book out on the room's page.
    - assets/fonts/literata/
    - assets/reader/
    # Read back for the app version in layout reports (layout_report_service).
    - pubspec.yaml
