project_id = "cotime-book"

[api]
enabled = true
schemas = ["public", "graphql_public", "cotime_book"]
extra_search_path = ["public", "extensions"]

[db]
# Match production so local migration replay catches PostgreSQL 15 behavior.
major_version = 15

[db.seed]
enabled = false

# Short-lived TURN credentials for direct book transfers (GH-60). Signed-in
# users only; the function also checks that the caller is in a room.
[functions.turn-credentials]
verify_jwt = true
